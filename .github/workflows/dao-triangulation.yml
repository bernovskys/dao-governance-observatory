name: Verify combined DAO dataset
on:
  workflow_dispatch:
  push:
    branches:
      - codex/dao-triangulation-20261104
permissions:
  contents: read
jobs:
  triangulation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DAO_REPO_ROOT: ${{ github.workspace }}
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/dao-matplotlib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - run: python verification/audit.py
      - run: python verification/links_audit.py
      - run: python verification/a_rows_audit.py
      - run: python verification/votes_audit.py
      - run: python verification/finish.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dao-triangulation-results
          path: verification/output/
